<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1A3308">
  <title>Sin conexión · MercaMesa</title>
  <!--
    Pantalla que muestra la app instalada cuando no hay internet (public/sw.js).
    Es HTML suelto, con todo adentro, a propósito: sin conexión no hay forma de
    traer el JavaScript ni los estilos de Next, y una página de Next se vería rota.
  -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #FAFAF5;
      color: #1A2610;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 360px; }
    img { width: 112px; height: 112px; border-radius: 28px; }
    h1 { margin: 24px 0 8px; font-size: 24px; color: #1A3308; }
    p { margin: 0 0 24px; font-size: 15px; line-height: 1.5; color: #3D4D2E; }
    button {
      border: 0;
      border-radius: 16px;
      padding: 14px 28px;
      background: #1A3308;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="MercaMesa">
    <h1>Sin conexión</h1>
    <p>Parece que no tienes internet. Revisa tu conexión y vuelve a intentarlo: tu canasta y tus pedidos te esperan.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
