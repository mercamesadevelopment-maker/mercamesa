name: Desplegar a staging

# Al fusionar en `develop`, aplica en STAGING las migraciones nuevas y despliega
# las funciones de borde. La aplicación la publica Vercel por su cuenta.
#
# Producción no se toca desde acá: sus migraciones las aplica la integración de
# Supabase con GitHub al fusionar en `main`, y sus funciones se despliegan a mano.
#
# Secretos, en Settings → Environments → staging (nunca los de producción):
#   STAGING_DB_URL         cadena del Session pooler de staging (ver .env.staging.example)
#   STAGING_PROJECT_REF    llfjupjvxucdjwezfpeq
#   SUPABASE_ACCESS_TOKEN  token personal de una cuenta con acceso al proyecto de staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  desplegar:
    name: Migraciones y funciones
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Defensa: si alguien pone por error los datos de producción en el entorno
      # de staging, el despliegue se detiene antes de tocar nada.
      - name: El destino no es producción
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
        run: |
          if [[ "$STAGING_DB_URL$STAGING_PROJECT_REF" == *zaqvcpehhmkiyjdbcufj* ]]; then
            echo "::error::Los secretos de staging apuntan a PRODUCCIÓN."
            exit 1
          fi

      - name: Aplicar migraciones
        run: supabase db push --db-url "${{ secrets.STAGING_DB_URL }}" --yes

      - name: Desplegar funciones de borde
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "${{ secrets.STAGING_PROJECT_REF }}"
